split:
  seed: 42
  val: 0.15
  test: 0.15
pairs:
  seed: 42
  mismatches_per_sketch: 1
train:
  seed: 42
  models: [logreg, xgboost, mlp]
  cv_folds: 5
  logreg:
    C: 1.0
  xgboost:
    n_estimators: 200
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
  mlp:
    hidden: 64
    alpha: 0.01
featurize:
  side: 256
  bins: 64
  grid: 16
