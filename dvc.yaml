stages:
  validate:
    cmd: python -m pipeline.validate
    deps:
      - pipeline/validate.py
      - data/raw/sketch2code
    outs:
      - data/validated/manifest.csv
    metrics:
      - reports/validate.json:
          cache: false

  split:
    cmd: python -m pipeline.split
    deps:
      - pipeline/split.py
      - data/validated/manifest.csv
    params:
      - split
    outs:
      - data/split/webpages.csv
    metrics:
      - reports/split.json:
          cache: false

  pairs:
    cmd: python -m pipeline.make_pairs
    deps:
      - pipeline/make_pairs.py
      - data/validated/manifest.csv
      - data/split/webpages.csv
    params:
      - pairs
    outs:
      - data/pairs/pairs.csv
    metrics:
      - reports/pairs.json:
          cache: false

  featurize:
    cmd: python -m pipeline.featurize
    deps:
      - pipeline/featurize.py
      - scoring/clip_score.py
      - data/pairs/pairs.csv
      - data/raw/sketch2code
    params:
      - featurize
    outs:
      - data/features/features.csv
      - data/features/embeddings.npz

  baseline:
    cmd: python -m pipeline.baseline
    deps:
      - pipeline/baseline.py
      - pipeline/metrics.py
      - data/features/features.csv
    metrics:
      - reports/baseline.json:
          cache: false

  train:
    cmd: python -m pipeline.train
    deps:
      - pipeline/train.py
      - pipeline/metrics.py
      - data/features/features.csv
      - data/features/embeddings.npz
    params:
      - train
    metrics:
      - reports/train.json:
          cache: false

  evaluate:
    cmd: python -m pipeline.evaluate
    deps:
      - pipeline/evaluate.py
      - reports/train.json
      - reports/baseline.json
      - data/features/features.csv
      - data/features/embeddings.npz
    metrics:
      - reports/evaluate.json:
          cache: false
