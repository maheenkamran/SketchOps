# The D1 pipeline. Run everything with:  dvc pull && dvc repro
# DVC re-runs a stage only when one of its deps changed.
stages:
  validate:
    cmd: python -m pipeline.validate
    deps:
      - pipeline/validate.py
      - data/raw/sketch2code
      # - data/raw/own        # add when our own photos are in
    outs:
      - data/validated/manifest.csv
    metrics:
      - reports/validate.json:
          cache: false        # small file, kept in Git so the report shows in commits and on DagsHub

  split:                      # by WEBPAGE, so no page is in two splits
    cmd: python -m pipeline.split
    deps:
      - pipeline/split.py
      - data/validated/manifest.csv
    params:
      - split
    outs:
      - data/split/webpages.csv
    metrics:
      - reports/split.json:
          cache: false

  pairs:
    cmd: python -m pipeline.make_pairs
    deps:
      - pipeline/make_pairs.py
      - data/validated/manifest.csv
      - data/split/webpages.csv
      # - data/renders          # add both once the renders are dvc-added and labelled
      # - data/labels/render_labels.csv
    params:
      - pairs
    outs:
      - data/pairs/pairs.csv
    metrics:
      - reports/pairs.json:
          cache: false

  featurize:
    cmd: python -m pipeline.featurize
    deps:
      - pipeline/featurize.py
      - scoring/clip_score.py
      - data/pairs/pairs.csv
      - data/raw/sketch2code
    params:
      - featurize
    outs:
      - data/features/features.csv
      - data/features/embeddings.npz

  baseline:                   # also logs one MLflow run per baseline (experiment "sketchops-scorer")
    cmd: python -m pipeline.baseline
    deps:
      - pipeline/baseline.py
      - pipeline/metrics.py
      - data/features/features.csv
    metrics:
      - reports/baseline.json:
          cache: false

  train:                      # one MLflow run per model, with the fitted model saved in the run
    cmd: python -m pipeline.train
    deps:
      - pipeline/train.py
      - pipeline/metrics.py
      - data/features/features.csv
      - data/features/embeddings.npz
    params:
      - train
    metrics:
      - reports/train.json:
          cache: false

  evaluate:                   # picks the champion on val, gates it against the baselines, registers it in MLflow
    cmd: python -m pipeline.evaluate
    deps:
      - pipeline/evaluate.py
      - reports/train.json
      - reports/baseline.json
      - data/features/features.csv     # used to re-check the registered model
      - data/features/embeddings.npz
    metrics:
      - reports/evaluate.json:
          cache: false
